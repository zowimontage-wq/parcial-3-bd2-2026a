{% extends "base.html" %}
{% block title %}Salas{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Salas</h1>
  <a class="btn btn-primary" href="{{ url_for('salas_nueva') }}">+ Nueva sala</a>
</div>

<div class="table-responsive">
  <table class="table table-striped align-middle">
    <thead>
      <tr><th>Nombre</th><th>Formato</th><th>Butacas</th><th class="text-end">Acciones</th></tr>
    </thead>
    <tbody>
      {% for s in salas %}
      <tr>
        <td>{{ s.nombre }}</td>
        <td><span class="badge bg-info text-dark">{{ s.formato }}</span></td>
        <td>{{ s.butacas }}</td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('salas_detail', id=s.id_sala) }}">Ver butacas</a>
          <form action="{{ url_for('salas_eliminar', id=s.id_sala) }}" method="post" class="d-inline"
                onsubmit="return confirm('¿Eliminar esta sala y sus butacas?');">
            <button class="btn btn-sm btn-outline-danger">Eliminar</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="text-center text-muted">No hay salas registradas.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
